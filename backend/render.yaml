services:
  - type: web
    name: worksync-backend
    env: node
    region: oregon           # or singapore for lower latency from India
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      # Set remaining secrets in the Render dashboard, not here:
      # MONGO_URI, JWT_SECRET, ADMIN_INVITE_TOKEN,
      # ALLOWED_ORIGINS, CLOUDINARY_CLOUD_NAME,
      # CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
